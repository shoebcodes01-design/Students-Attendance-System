
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        
        <header>
            <h1>Student Attendance System</h1>
            <p>Manage Student Attendance</p>
        </header>


        
        <div class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Present</h3>
                <p id="presentCount">0</p>
            </div>

            <div class="card">
                <h3>Absent</h3>
                <p id="absentCount">0</p>
            </div>

        </div>


        
        <div class="add-section">

            <h2>Add Student</h2>

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="rollNumber"
                placeholder="Roll Number"
            >

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>


        
        <div class="controls">

            <input
                type="date"
                id="attendanceDate"
            >

            <input
                type="text"
                id="searchStudent"
                placeholder="Search student..."
                onkeyup="searchStudent()"
            >

        </div>


        
        <div class="table-section">

            <h2>Student Attendance</h2>

            <table>

                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Attendance</th>
                        <th>Percentage</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

        </div>


        
        <div class="buttons">

            <button
                class="save-btn"
                onclick="saveAttendance()"
            >
            
            </button>

            <button
                class="clear-btn"
                onclick="clearAllStudents()"
            >
                Clear All
            </button>

        </div>

    </div>


    
    <script src="script.js"></script>
</body>

</html>
